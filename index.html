<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MedTracker Pro – MBBS Study System</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a12;}
.notif-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;}
.notif-box{background:linear-gradient(135deg,#0d0d25,#0a1a2e);border:2px solid #7c3aed;border-radius:16px;padding:24px;max-width:380px;width:100%;box-shadow:0 0 40px rgba(124,58,237,0.4);}
.notif-title{font-size:18px;font-weight:700;color:#a78bfa;margin-bottom:8px;font-family:'DM Mono',monospace;}
.notif-body{font-size:13px;color:#c4b5fd;margin-bottom:16px;line-height:1.7;font-family:'DM Mono',monospace;}
.notif-inp{width:100%;background:#070714;border:1px solid #4f46e5;color:#ddd8f0;border-radius:8px;padding:10px 12px;font-size:13px;font-family:'DM Mono',monospace;outline:none;margin-bottom:12px;box-sizing:border-box;resize:vertical;min-height:80px;}
.notif-btn{padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-family:'DM Mono',monospace;font-weight:700;color:#fff;background:linear-gradient(135deg,#7c3aed,#4f46e5);margin-right:8px;}
.notif-btn.skip{background:linear-gradient(135deg,#374151,#1f2937);}
.chat-msg{padding:10px 13px;border-radius:10px;margin-bottom:8px;font-size:12px;line-height:1.7;font-family:'DM Mono',monospace;max-width:88%;word-break:break-word;}
.chat-msg.user{background:#1a0a3e;border:1px solid #5b21b6;color:#c4b5fd;margin-left:auto;border-bottom-right-radius:3px;}
.chat-msg.ai{background:#050f1a;border:1px solid #1e3a5f;color:#93c5fd;margin-right:auto;border-bottom-left-radius:3px;}
.chat-typing{color:#5a6880;font-size:11px;font-style:italic;padding:4px 0;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const SUBJECTS = ["Anatomy","Physiology","Biochemistry","Pathology","Pharmacology","Microbiology","Forensic Medicine","Community Medicine","ENT","Ophthalmology","Medicine","Surgery","Obstetrics","Gynaecology","Pediatrics","Orthopedics","Radiology","Anesthesia","Psychiatry"];

// 24 time slots: 00:00–01:00 ... 23:00–00:00
const TIME_SLOTS = Array.from({length:24},(_,i)=>{
  const s = `${String(i).padStart(2,"0")}:00`;
  const e = i===23?"00:00":`${String(i+1).padStart(2,"0")}:00`;
  return {key:`${s}-${e}`, label:`${s} – ${e}`, hour:i};
});

const getToday = () => new Date().toISOString().split("T")[0];
const TABS = ["📅 Daily","📖 Reading","🧪 QBank","📊 Reports","⚙️ Settings"];

// ── Notification Permission ──
const requestNotifPermission = async () => {
  if(!("Notification" in window)) return false;
  if(Notification.permission==="granted") return true;
  const p = await Notification.requestPermission();
  return p==="granted";
};

const sendBrowserNotif = (title, body) => {
  if(Notification.permission==="granted"){
    new Notification(title,{body, icon:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩺</text></svg>"});
  }
};

// Register Service Worker for background notifications
const registerSW = () => {
  if("serviceWorker" in navigator){
    const sw = `
self.addEventListener('message', e => {
  if(e.data && e.data.type === 'SHOW_NOTIF'){
    self.registration.showNotification(e.data.title, {body: e.data.body, icon: '/icon.png', badge: '/icon.png', requireInteraction: true, tag: 'medtracker-hourly'});
  }
});
self.addEventListener('notificationclick', e => { e.notification.close(); clients.openWindow('/'); });
`;
    const blob = new Blob([sw],{type:"application/javascript"});
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(()=>{});
  }
};

function App() {
  const [tab, setTab] = useState(0);
  const [apiKeyInput, setApiKeyInput] = useState(() => localStorage.getItem("gemini_key") || "");
  const [apiKey, setApiKey] = useState(() => localStorage.getItem("gemini_key") || "");
  const [logs, setLogs] = useState(() => { try { return JSON.parse(localStorage.getItem("daily_logs") || "{}"); } catch { return {}; } });
  const [selectedDate, setSelectedDate] = useState(getToday());
  const [readingData, setReadingData] = useState(() => { try { return JSON.parse(localStorage.getItem("reading_data") || "{}"); } catch { return {}; } });
  const [rdDate, setRdDate] = useState(getToday());
  const [rdSubject, setRdSubject] = useState(SUBJECTS[0]);
  const [rdPages, setRdPages] = useState("");
  const [rdFromPage, setRdFromPage] = useState("");
  const [rdToPage, setRdToPage] = useState("");
  const [rdVideoHours, setRdVideoHours] = useState("");
  const [rdFlashcards, setRdFlashcards] = useState("");
  const [qbankData, setQbankData] = useState(() => { try { return JSON.parse(localStorage.getItem("qbank_data") || "{}"); } catch { return {}; } });
  const [qbankDate, setQbankDate] = useState(getToday());
  const [qbankSubject, setQbankSubject] = useState(SUBJECTS[0]);
  const [qbankTopic, setQbankTopic] = useState("");
  const [qTotal, setQTotal] = useState("");
  const [qWrong, setQWrong] = useState("");
  const [qNotes, setQNotes] = useState("");
  const [screenshotAnalysis, setScreenshotAnalysis] = useState("");
  const [ssLoading, setSsLoading] = useState(false);
  const fileRef = useRef();
  const [reportType, setReportType] = useState("daily");
  const [goals, setGoals] = useState(() => { try { return JSON.parse(localStorage.getItem("daily_goals") || "{}"); } catch { return {}; } });
  const [goalSubject, setGoalSubject] = useState(SUBJECTS[0]);
  const [goalPages, setGoalPages] = useState("");
  const [goalVideoHours, setGoalVideoHours] = useState("");
  const [goalDate, setGoalDate] = useState(getToday());
  const [readCounts, setReadCounts] = useState(() => { try { return JSON.parse(localStorage.getItem("read_counts") || "{}"); } catch { return {}; } });
  const [reportOutput, setReportOutput] = useState("");
  const [reportLoading, setReportLoading] = useState(false);
  const [fullAnalysis, setFullAnalysis] = useState("");
  const [fullLoading, setFullLoading] = useState(false);

  // Notification & popup states
  const [showHourlyPopup, setShowHourlyPopup] = useState(false);
  const [popupSlot, setPopupSlot] = useState(null);
  const [popupInput, setPopupInput] = useState("");
  const [wakeTime, setWakeTime] = useState(() => localStorage.getItem("wake_time") || "08:00");
  const [notifEnabled, setNotifEnabled] = useState(() => localStorage.getItem("notif_enabled")==="true");
  const [showWakeSetup, setShowWakeSetup] = useState(false);
  const [lastHourPrompted, setLastHourPrompted] = useState(() => parseInt(localStorage.getItem("last_hour_prompted")||"-1"));
  const [midnightPopupShown, setMidnightPopupShown] = useState(() => localStorage.getItem("midnight_popup_shown")===getToday());

  // Chat states
  const [chatMessages, setChatMessages] = useState([]);
  const [chatInput, setChatInput] = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const chatEndRef = useRef();

  useEffect(()=>localStorage.setItem("daily_logs",JSON.stringify(logs)),[logs]);
  useEffect(()=>localStorage.setItem("qbank_data",JSON.stringify(qbankData)),[qbankData]);
  useEffect(()=>localStorage.setItem("reading_data",JSON.stringify(readingData)),[readingData]);
  useEffect(()=>localStorage.setItem("daily_goals",JSON.stringify(goals)),[goals]);
  useEffect(()=>localStorage.setItem("read_counts",JSON.stringify(readCounts)),[readCounts]);
  useEffect(()=>localStorage.setItem("notif_enabled",notifEnabled),[notifEnabled]);
  useEffect(()=>localStorage.setItem("last_hour_prompted",lastHourPrompted),[lastHourPrompted]);

  // Register SW on mount
  useEffect(()=>{ registerSW(); },[]);

  // Request notification permission
  const enableNotifications = async () => {
    const granted = await requestNotifPermission();
    if(granted){ setNotifEnabled(true); alert("✅ Notifications ON! Hourly reminders chalenge."); }
    else{ alert("❌ Notification permission denied. Browser settings mein allow karo."); }
  };

  // Hourly notification check
  useEffect(()=>{
    if(!notifEnabled) return;
    const check = () => {
      const now = new Date();
      const currentHour = now.getHours();
      const currentMin = now.getMinutes();
      const wakeHour = parseInt(wakeTime.split(":")[0]);

      // Midnight popup: around 23:45–00:15 ask wake time for tomorrow
      if(currentHour===23 && currentMin>=45 && !midnightPopupShown){
        setShowWakeSetup(true);
        setMidnightPopupShown(true);
        localStorage.setItem("midnight_popup_shown", getToday());
        sendBrowserNotif("🩺 MedTracker – Kal ka plan?", "Wake-up time set karo kal ke liye!");
      }

      // Hourly popup: only after wake time, every hour at ~:00 to :05
      if(currentHour >= wakeHour && currentMin <= 7 && currentHour !== lastHourPrompted){
        const slot = TIME_SLOTS[currentHour];
        setPopupSlot(slot);
        setPopupInput("");
        setShowHourlyPopup(true);
        setLastHourPrompted(currentHour);
        sendBrowserNotif(`⏰ ${slot.label}`, "Kya kiya is ghante? MedTracker mein bharo!");
      }
    };
    check();
    const interval = setInterval(check, 60000);
    return ()=>clearInterval(interval);
  },[notifEnabled, wakeTime, lastHourPrompted, midnightPopupShown]);

  // Scroll chat to bottom
  useEffect(()=>{ chatEndRef.current?.scrollIntoView({behavior:"smooth"}); },[chatMessages]);

  const saveApiKey = () => { localStorage.setItem("gemini_key",apiKeyInput); setApiKey(apiKeyInput); alert("Key save ho gayi!"); };

  const exportData = () => {
    const data = {version:"3.0",exportDate:new Date().toISOString(),daily_logs:logs,reading_data:readingData,qbank_data:qbankData,daily_goals:goals,read_counts:readCounts};
    const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=`MedTracker_Backup_${getToday()}.json`; a.click(); URL.revokeObjectURL(url);
  };
  const importRef = useRef();
  const importData = (e) => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if(!window.confirm("Purana data replace hoga. Sure?")) return;
        if(data.daily_logs){setLogs(data.daily_logs);localStorage.setItem("daily_logs",JSON.stringify(data.daily_logs));}
        if(data.reading_data){setReadingData(data.reading_data);localStorage.setItem("reading_data",JSON.stringify(data.reading_data));}
        if(data.qbank_data){setQbankData(data.qbank_data);localStorage.setItem("qbank_data",JSON.stringify(data.qbank_data));}
        if(data.daily_goals){setGoals(data.daily_goals);localStorage.setItem("daily_goals",JSON.stringify(data.daily_goals));}
        if(data.read_counts){setReadCounts(data.read_counts);localStorage.setItem("read_counts",JSON.stringify(data.read_counts));}
        alert("Data import ho gaya!");
      } catch(err){alert("Error: "+err.message);}
    };
    reader.readAsText(file); e.target.value="";
  };

  const saveGoal = () => {
    if(!goalPages&&!goalVideoHours){alert("Pages ya Video Hours target bharo!");return;}
    const existing=(goals[goalDate]||[]).filter(g=>g.subject!==goalSubject);
    existing.push({subject:goalSubject,targetPages:goalPages?+goalPages:0,targetVideoHours:goalVideoHours?+goalVideoHours:0,date:goalDate,id:Date.now()});
    setGoals(prev=>({...prev,[goalDate]:existing}));
    setGoalPages(""); setGoalVideoHours("");
  };
  const deleteGoal=(date,id)=>setGoals(prev=>({...prev,[date]:(prev[date]||[]).filter(g=>g.id!==id)}));
  const getTodayGoals=()=>goals[getToday()]||[];
  const getGoalProgress=(subject,date)=>{
    const target=(goals[date]||[]).find(g=>g.subject===subject);
    if(!target) return null;
    const actualPages=(readingData[date]||[]).filter(e=>e.subject===subject).reduce((s,e)=>s+(e.pages||0),0);
    const actualVideo=(readingData[date]||[]).filter(e=>e.subject===subject).reduce((s,e)=>s+(e.videoHours||0),0);
    const hasPages=target.targetPages>0, hasVideo=target.targetVideoHours>0;
    const pgPct=hasPages?Math.min(100,Math.round(actualPages/target.targetPages*100)):100;
    const vidPct=hasVideo?Math.min(100,Math.round(actualVideo/target.targetVideoHours*100)):100;
    const overallPct=hasPages&&hasVideo?Math.round((pgPct+vidPct)/2):hasPages?pgPct:vidPct;
    return {target:target.targetPages,actualPages,pct:overallPct,pgPct,vidPct,actualVideo,targetVideoHours:target.targetVideoHours||0,hasPages,hasVideo};
  };
  const incrementReadCount=(subject)=>setReadCounts(prev=>({...prev,[subject]:(prev[subject]||0)+1}));
  const decrementReadCount=(subject)=>setReadCounts(prev=>({...prev,[subject]:Math.max(0,(prev[subject]||0)-1)}));
  const updateHourLog=(slotKey,val)=>setLogs(prev=>({...prev,[selectedDate]:{...(prev[selectedDate]||{}),[slotKey]:val}}));
  const getDayLogs=(date)=>logs[date]||{};

  const callAI = async (prompt, images=[], maxOut=1500) => {
    const key = localStorage.getItem("gemini_key")||"";
    if(!key) throw new Error("Gemini API Key nahi hai! Settings > API Key mein daalo. Free: aistudio.google.com/apikey");
    const parts=[];
    for(const img of images){
      if(img.source&&img.source.data) parts.push({inline_data:{mime_type:img.source.media_type,data:img.source.data}});
    }
    parts.push({text:prompt});
    const res = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`,
      {method:"POST",headers:{"Content-Type":"application/json"},
       body:JSON.stringify({contents:[{parts}],generationConfig:{maxOutputTokens:maxOut}})}
    );
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    return data.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"No response";
  };

  const addReadingEntry=()=>{
    if(!rdPages&&!rdVideoHours){alert("Pages ya Video Hours bharo!");return;}
    const entry={id:Date.now(),date:rdDate,subject:rdSubject,pages:rdPages?+rdPages:0,fromPage:rdFromPage?+rdFromPage:null,toPage:rdToPage?+rdToPage:null,videoHours:rdVideoHours?+rdVideoHours:0,flashcards:rdFlashcards?+rdFlashcards:0};
    setReadingData(prev=>({...prev,[rdDate]:[...(prev[rdDate]||[]),entry]}));
    setRdPages(""); setRdFromPage(""); setRdToPage(""); setRdVideoHours(""); setRdFlashcards("");
  };
  const deleteReadingEntry=(date,id)=>setReadingData(prev=>({...prev,[date]:(prev[date]||[]).filter(e=>e.id!==id)}));

  const getReadingStats=()=>{
    const all=Object.values(readingData).flat();
    const bySubject={};
    all.forEach(e=>{
      if(!bySubject[e.subject]) bySubject[e.subject]={pages:0,sessions:0,videoHours:0,flashcards:0};
      bySubject[e.subject].pages+=(e.pages||0);
      bySubject[e.subject].videoHours+=(e.videoHours||0);
      bySubject[e.subject].flashcards+=(e.flashcards||0);
      bySubject[e.subject].sessions+=1;
    });
    return {bySubject,totalPages:all.reduce((s,e)=>s+(e.pages||0),0),totalVideoHours:all.reduce((s,e)=>s+(e.videoHours||0),0),totalFlashcards:all.reduce((s,e)=>s+(e.flashcards||0),0),totalSessions:all.length};
  };

  const getReadingSummaryForReport=(days=null)=>{
    let entries=Object.values(readingData).flat();
    if(days){const cutoff=new Date();cutoff.setDate(cutoff.getDate()-days);entries=entries.filter(e=>new Date(e.date)>=cutoff);}
    const bySubject={};
    entries.forEach(e=>{if(!bySubject[e.subject])bySubject[e.subject]={pages:0,sessions:0};bySubject[e.subject].pages+=e.pages;bySubject[e.subject].sessions+=1;});
    return Object.entries(bySubject).map(([s,d])=>`${s}: ${d.pages} pages, ${d.sessions} sessions`).join("\n")||"No reading data";
  };

  // ── MAIN: Full Day Combined Analysis ──
  const analyseFullDay = async () => {
    const date = selectedDate;
    const dayLog = logs[date]||{};
    const filled = Object.entries(dayLog).filter(([,v])=>v?.trim());
    const readEntries = readingData[date]||[];
    const qEntries = qbankData[date]||[];
    const dayGoals = goals[date]||[];
    if(!filled.length&&!readEntries.length&&!qEntries.length){alert("Kuch bhi log nahi hai!"); return;}
    setFullLoading(true); setFullAnalysis(""); setChatMessages([]);
    try {
      const logText = filled.length?filled.map(([h,v])=>`${h}: ${v}`).join("\n"):"No hourly log";
      const totalPages=readEntries.reduce((a,e)=>a+(e.pages||0),0);
      const totalVid=readEntries.reduce((a,e)=>a+(e.videoHours||0),0);
      const totalFC=readEntries.reduce((a,e)=>a+(e.flashcards||0),0);
      const totalQ=qEntries.reduce((a,e)=>a+e.total,0);
      const totalW=qEntries.reduce((a,e)=>a+e.wrong,0);
      const accuracy=totalQ>0?Math.round((1-totalW/totalQ)*100):null;

      // Targets vs actual
      const targetLines = dayGoals.map(g=>{
        const prog=getGoalProgress(g.subject,date);
        let s=`${g.subject}: `;
        if(g.targetPages>0) s+=`Pages ${prog?prog.actualPages:0}/${g.targetPages} (${prog?prog.pgPct:0}%) `;
        if(g.targetVideoHours>0) s+=`Video ${prog?prog.actualVideo:0}/${g.targetVideoHours}hr (${prog?prog.vidPct:0}%)`;
        const met=(prog?prog.pct:0)>=100;
        s+=met?" ✅ MET":" ❌ MISSED";
        return s;
      }).join("\n")||"No targets set";

      // Wrong Q breakdown
      const wrongBreakdown=qEntries.filter(e=>e.wrong>0).map(e=>`${e.subject}/${e.topic}: ${e.wrong}/${e.total} wrong`).join("\n")||"None";

      const prompt=`Tu NEET PG coach hai. Hinglish mein bol — short, direct, no fluff.

DATE: ${date}

━━ HOURLY SCHEDULE ━━
${logText}

━━ READING ━━
${readEntries.map(e=>`${e.subject}: ${e.pages||0}pg, ${e.videoHours||0}hr video, ${e.flashcards||0} FC`).join("\n")||"Nothing"}
TOTAL: ${totalPages}pg | ${totalVid}hr video | ${totalFC} flashcards

━━ QBANK ━━
${wrongBreakdown}
Total: ${totalQ} Qs | Wrong: ${totalW} | Accuracy: ${accuracy!==null?accuracy+"%":"N/A"}

━━ TARGETS VS ACTUAL ━━
${targetLines}

FORMAT (use emojis, keep each section crisp — no long paragraphs):

━━━ 📋 FULL DAY REPORT – ${date} ━━━

⏱️ TIME AUDIT
Productive: Xhr | Wasted: Xhr
Wasted kahan: [slot → reason, 5 words max each]

📖 READING SNAPSHOT
Pages: ${totalPages} | Video: ${totalVid}hr | FC: ${totalFC}
Best subject: __ | Sabse weak effort: __

🎯 TARGET ACHIEVEMENT
[har target: subject → actual/target → MET/MISSED by X]
Overall: X/Y targets met

❌ MISTAKES ANALYSIS (PRIORITY SECTION)
[har galat topic ke liye:]
• Subject/Topic: X/${totalQ>0?totalQ:""} wrong → Root cause (1 line) → Fix kaise kare (1 line)
Pattern: [common mistake type]

📊 EFFICIENCY SCORE: X/10

✅ 3 WINS:
1. 2. 3.

❌ 3 PROBLEMS:
1. 2. 3.

🌙 KAL KA PLAN (raat-focused, no 5am/6am wala):
• [Subject]: X pages + X video
• QBank: [Subject] X Qs — focus on [weak topic]
• Revision: [topic]

💡 NEET PG TIP: [1 high-yield specific tip]

Hinglish mein. Direct. Max 40 lines.`;

      const result = await callAI(prompt,[],2500);
      setFullAnalysis(result);
      // Seed chat context
      setChatMessages([{role:"system_context", content: result, hidden:true}]);
    } catch(e){setFullAnalysis("Error: "+e.message);}
    setFullLoading(false);
  };

  // ── AI Chat ──
  const sendChat = async () => {
    if(!chatInput.trim()) return;
    const userMsg = chatInput.trim();
    setChatInput("");
    const newMsgs = [...chatMessages, {role:"user",content:userMsg}];
    setChatMessages(newMsgs);
    setChatLoading(true);
    try {
      const context = fullAnalysis?`Context (today's report):\n${fullAnalysis}\n\n`:"";
      const history = newMsgs.filter(m=>m.role!=="system_context").slice(-6).map(m=>`${m.role==="user"?"Student":"Coach"}: ${m.content}`).join("\n");
      const prompt = `${context}Tu NEET PG coach hai. Hinglish mein bol — helpful, direct, specific. Student ke saath freely baat kar, mistakes improve karo.\n\nConversation:\n${history}\nCoach:`;
      const reply = await callAI(prompt,[],800);
      setChatMessages(prev=>[...prev,{role:"ai",content:reply}]);
    } catch(e){ setChatMessages(prev=>[...prev,{role:"ai",content:"Error: "+e.message}]); }
    setChatLoading(false);
  };

  const addQBankEntry=()=>{
    if(!qbankTopic.trim()||!qTotal||qWrong===""){alert("Topic, Total aur Wrong bharo!");return;}
    const entry={date:qbankDate,subject:qbankSubject,topic:qbankTopic.trim(),total:+qTotal,wrong:+qWrong,notes:qNotes.trim(),id:Date.now()};
    setQbankData(prev=>({...prev,[qbankDate]:[...(prev[qbankDate]||[]),entry]}));
    setQbankTopic(""); setQTotal(""); setQWrong(""); setQNotes("");
  };
  const deleteQBankEntry=(date,id)=>setQbankData(prev=>({...prev,[date]:(prev[date]||[]).filter(e=>e.id!==id)}));

  const analyseScreenshots=async(files)=>{
    if(!files.length) return;
    setSsLoading(true); setScreenshotAnalysis("");
    try {
      const imgs=await Promise.all(Array.from(files).map(f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({type:"image",source:{type:"base64",media_type:f.type,data:r.result.split(",")[1]}});r.onerror=rej;r.readAsDataURL(f);})));
      const prompt=`MBBS student ke galat QBank answers ke screenshots hain.\nHinglish mein batao:\n1. Har wrong question ka Subject & Topic\n2. Mistake pattern\n3. Table: Subject | Topic | # Mistakes\n4. Top 3 topics to revise\n5. Quick fix tip per weak topic\nShort aur direct raho.`;
      const text=await callAI(prompt,imgs,1200);
      setScreenshotAnalysis(text);
      const today=getToday();

        const qText=qToday.map(e=>`${e.subject}/${e.topic}: ${e.wrong}/${e.total} wrong`).join("\n")||"No QBank";
        prompt=`NEET PG Daily Report – ${today}\nLogs:\n${logText}\nReading: ${rdToday.reduce((s,e)=>s+e.pages,0)}pg\nQBank:\n${qText}\nHinglish mein: Summary, Wins, Problems, Kal ka plan. Direct.`;
      } else if(reportType==="weekly"){
        const allDates=Object.keys(logs).sort().slice(-7);

        prompt=`NEET PG Weekly Report (last 7 days)\nTotal pages: ${weeklyPages}\nActivity: ${allDates.map(d=>`${d}: ${Object.values(logs[d]).filter(Boolean).length} slots`).join(", ")}\nQBank:\n${qSummary}\nHinglish mein: Score/10, Top 3 weak topics, Next week plan. Motivating.`;
      } else {
        const allQ=Object.values(qbankData).flat();
        const totalPages=Object.values(readingData).flat().reduce((s,e)=>s+e.pages,0);
        prompt=`NEET PG Monthly Report\nTotal pages: ${totalPages} | QBank Qs: ${allQ.reduce((s,e)=>s+e.total,0)}\nReading:\n${getReadingSummaryForReport(null)}\nHinglish mein: Overview, Top 5 weak topics, Revision roadmap. Detailed.`;

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"6px",marginBottom:"10px"}}>
            <div style={{background:"#070714",border:"1px solid #1a2a1a",borderRadius:"8px",padding:"10px",textAlign:"center"}}><div style={{fontSize:"22px",fontWeight:700,color:"#4ade80"}}>{rdStats.totalPages}</div><div style={{fontSize:"9px",color:"#3a6a3a"}}>Pages</div></div>
            <div style={{background:"#070714",border:"1px solid #1a2a3a",borderRadius:"8px",padding:"10px",textAlign:"center"}}><div style={{fontSize:"22px",fontWeight:700,color:"#60a5fa"}}>{rdStats.totalVideoHours||0}</div><div style={{fontSize:"9px",color:"#3a4a6a"}}>Video Hrs</div></div>
            <div style={{background:"#070714",border:"1px solid #2a1a2a",borderRadius:"8px",padding:"10px",textAlign:"center"}}><div style={{fontSize:"22px",fontWeight:700,color:"#f472b6"}}>{rdStats.totalFlashcards||0}</div><div style={{fontSize:"9px",color:"#6a3a5a"}}>Flashcards</div></div>
          </div>
          {Object.entries(rdStats.bySubject).sort((a,b)=>b[1].pages-a[1].pages).map(([subj,data])=>{
            const maxPg=Math.max(...Object.values(rdStats.bySubject).map(d=>d.pages),1);
            return <div key={subj} style={{marginBottom:"8px"}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:"12px",marginBottom:"2px"}}>
                <span style={{color:"#a0d8a0"}}>{subj}</span>
                <div style={{display:"flex",gap:"4px",flexWrap:"wrap"}}>
                  {(data.pages||0)>0&&<span style={s.badge("green")}>{data.pages}pg</span>}
                  {(data.videoHours||0)>0&&<span style={s.badge("blue")}>{data.videoHours}hr</span>}
                  <span style={s.badge("blue")}>{data.sessions}x</span>
                </div>
              </div>
              <div style={s.bar(Math.round((data.pages||0)/maxPg*100),"#22c55e")}/>
            </div>;
          })}
        </div>}
      </div>}

      {/* ━━ TAB 2: QBANK ━━ */}
      {tab===2 && <div style={s.page}>
        <div style={s.card}>
          <label style={s.lbl}>➕ QBank Entry</label>
          <div style={{marginBottom:"8px"}}><label style={s.lbl}>Date</label><input type="date" value={qbankDate} onChange={e=>setQbankDate(e.target.value)} style={s.inp}/></div>
          <div style={{marginBottom:"8px"}}><label style={s.lbl}>Subject</label><select value={qbankSubject} onChange={e=>setQbankSubject(e.target.value)} style={s.sel}>{SUBJECTS.map(sub=><option key={sub}>{sub}</option>)}</select></div>
          <div style={{marginBottom:"8px"}}><label style={s.lbl}>Topic</label><input placeholder="e.g. Brachial Plexus" value={qbankTopic} onChange={e=>setQbankTopic(e.target.value)} style={s.inp}/></div>
          <div style={s.row}>
            <div style={{flex:1}}><label style={s.lbl}>Total Qs</label><input type="number" min="0" placeholder="50" value={qTotal} onChange={e=>setQTotal(e.target.value)} style={s.inp}/></div>
            <div style={{flex:1}}><label style={s.lbl}>Wrong</label><input type="number" min="0" placeholder="12" value={qWrong} onChange={e=>setQWrong(e.target.value)} style={s.inp}/></div>
          </div>
          <div style={{marginBottom:"10px"}}><label style={s.lbl}>Notes</label><textarea placeholder="Weak concept?" value={qNotes} onChange={e=>setQNotes(e.target.value)} style={s.ta}/></div>
          <button style={s.btn("blue")} onClick={addQBankEntry}>✅ Save Karo</button>
        </div>

        <div style={s.card}>
          <label style={s.lbl}>📸 Screenshots → AI Analysis</label>
          <p style={{fontSize:"11px",color:"#5a6880",marginBottom:"10px",lineHeight:"1.6"}}>Galat answers ke screenshots upload karo – AI analyse karega</p>
          <input type="file" ref={fileRef} multiple accept="image/*" style={{display:"none"}} onChange={e=>analyseScreenshots(e.target.files)}/>
          <button style={s.btn("green")} onClick={()=>fileRef.current.click()} disabled={ssLoading}>{ssLoading?"🔄 Analyse Ho Raha Hai...":"📤 Screenshots Upload"}</button>
          {screenshotAnalysis&&<div style={s.aiBox}><div style={{fontSize:"9px",color:"#3a5a3a",marginBottom:"6px"}}>🔍 SCREENSHOT ANALYSIS</div>{screenshotAnalysis}</div>}
        </div>

        {todayQBank.length>0&&<div style={s.card}>
          <label style={s.lbl}>📋 {qbankDate} Entries</label>
          {todayQBank.map(e=><div key={e.id} style={{borderBottom:"1px solid #151525",padding:"7px 0"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:"12px",fontWeight:600,color:"#c4b5fd"}}>{e.subject}</span>
              <div style={{display:"flex",gap:"6px",alignItems:"center"}}>
                <span style={s.badge(e.total>0&&e.wrong/e.total>0.5?"red":"green")}>{e.wrong}/{e.total}W</span>
                <button onClick={()=>deleteQBankEntry(qbankDate,e.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#5a2a2a",fontSize:"14px"}}>✕</button>
              </div>
            </div>
            <div style={{fontSize:"11px",color:"#7a8aa8",marginTop:"2px"}}>{e.topic}</div>
            {e.total>0&&<div style={s.bar(Math.min(100,e.wrong/e.total*100))}/>}
          </div>)}
        </div>}

        {mistakes.length>0&&<div style={s.card}>
          <label style={s.lbl}>🔴 Top Weak Topics (All Time)</label>
          {mistakes.map((m,i)=><div key={i} style={{marginBottom:"8px"}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:"12px"}}>
              <span style={{color:"#c4b5fd",flex:1}}>{m.subject} <span style={{color:"#6a7a98"}}>→ {m.topic}</span></span>
              <span style={s.badge("red")}>{m.wrong}W</span>
            </div>
            <div style={s.bar(Math.min(100,m.total>0?m.wrong/m.total*100:100))}/>
          </div>)}
        </div>}
      </div>}

      {/* ━━ TAB 3: REPORTS ━━ */}
      {tab===3 && <div style={s.page}>
        <div style={s.grid2}>
          {[
            {l:"Study Days",v:Object.keys(logs).length,col:"#a78bfa"},
            {l:"Total Pages",v:rdStats.totalPages,col:"#4ade80"},
            {l:"Video Hrs",v:rdStats.totalVideoHours,col:"#60a5fa"},
            {l:"Flashcards",v:rdStats.totalFlashcards,col:"#f472b6"},
            {l:"QBank Qs",v:Object.values(qbankData).flat().reduce((a,e)=>a+e.total,0),col:"#fbbf24"},
            {l:"Wrong Qs",v:Object.values(qbankData).flat().reduce((a,e)=>a+e.wrong,0),col:"#f87171"},
          ].map((x,i)=>(
            <div key={i} style={{...s.card,textAlign:"center",padding:"12px",marginBottom:0}}>
              <div style={{fontSize:"20px",fontWeight:700,color:x.col,margin:"2px 0"}}>{x.v}</div>
              <div style={{fontSize:"10px",color:"#3a4a60"}}>{x.l}</div>
            </div>
          ))}
        </div>

        {/* 7-day graph */}
        {(()=>{
          const last7=[...Array(7)].map((_,i)=>{
            const d=new Date();d.setDate(d.getDate()-6+i);
            const key=d.toISOString().split("T")[0];
            const rd=readingData[key]||[], qb=qbankData[key]||[];
            return {day:d.toLocaleDateString("en",{weekday:"short"}),pages:rd.reduce((a,e)=>a+(e.pages||0),0),qTotal:qb.reduce((a,e)=>a+e.total,0),activeHours:Object.values(logs[key]||{}).filter(Boolean).length,hasTarget:(goals[key]||[]).length>0,targetMet:(goals[key]||[]).every(g=>{const actual=(readingData[key]||[]).filter(e=>e.subject===g.subject).reduce((a,e)=>a+(e.pages||0),0);return actual>=g.targetPages;})};
          });
          const maxPg=Math.max(...last7.map(d=>d.pages),1), maxQs=Math.max(...last7.map(d=>d.qTotal),1);
          return (
            <div style={s.card}>
              <label style={s.lbl}>Last 7 Days</label>
              <div style={{fontSize:"10px",color:"#5a6880",marginBottom:"6px"}}>🟢 Pages  🟣 QBank Qs</div>
              <div style={{display:"flex",gap:"4px",alignItems:"flex-end",height:"80px",marginBottom:"12px"}}>
                {last7.map((d,i)=>(
                  <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"2px",height:"100%",justifyContent:"flex-end"}}>
                    <div style={{width:"100%",display:"flex",gap:"1px",alignItems:"flex-end",height:"65px"}}>
                      <div style={{flex:1,background:"#22c55e",borderRadius:"2px 2px 0 0",height:Math.max(4,Math.round(d.pages/maxPg*65))+"px",opacity:0.9}}/>
                      <div style={{flex:1,background:"#7c3aed",borderRadius:"2px 2px 0 0",height:Math.max(d.qTotal>0?4:0,Math.round(d.qTotal/maxQs*65))+"px",opacity:0.9}}/>
                    </div>
                    <div style={{fontSize:"8px",color:"#3a4a60"}}>{d.day}</div>
                    {d.hasTarget&&<div style={{fontSize:"7px",color:d.targetMet?"#4ade80":"#f87171"}}>{d.targetMet?"✓":"○"}</div>}
                  </div>
                ))}
              </div>
            </div>
          );
        })()}

        <div style={s.card}>
          <label style={s.lbl}>📊 Report Type</label>
          <div style={{display:"flex",gap:"6px",marginBottom:"12px",flexWrap:"wrap"}}>
            {[["daily","📅 Daily"],["weekly","📆 Weekly"],["monthly","🗓️ Monthly"]].map(([t,l])=>(
              <button key={t} onClick={()=>setReportType(t)} style={{...s.btn(reportType===t?"purple":"blue"),opacity:reportType===t?1:0.55}}>{l}</button>
            ))}
          </div>
          <button style={{...s.btn("purple"),width:"100%",padding:"12px",fontSize:"13px"}} onClick={generateReport} disabled={reportLoading}>{reportLoading?"🔄 Generate Ho Rahi Hai...":"⚡ Report Generate Karo"}</button>
        </div>

        {reportOutput&&<div style={s.card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"10px",flexWrap:"wrap",gap:"8px"}}>
            <label style={s.lbl}>{reportType.toUpperCase()} REPORT</label>
            <div style={{display:"flex",gap:"6px"}}>
              <button style={s.btn("blue")} onClick={()=>{const el=document.createElement("a");el.href="data:text/plain;charset=utf-8,"+encodeURIComponent(reportOutput);el.download=`MBBS_${reportType}_${getToday()}.txt`;el.click();}}>💾 .txt</button>
              <button style={s.btn("green")} onClick={()=>{const el=document.createElement("a");const html=`<html><head><style>body{font-family:monospace;background:#0a0a12;color:#c4b5fd;padding:24px;white-space:pre-wrap;line-height:1.8;}</style></head><body>${reportOutput}</body></html>`;el.href="data:text/html;charset=utf-8,"+encodeURIComponent(html);el.download=`MBBS_${reportType}_${getToday()}.html`;el.click();}}>💾 .html</button>
            </div>
          </div>
          <div style={s.aiBox}>{reportOutput}</div>
        </div>}
      </div>}

      {/* ━━ TAB 4: SETTINGS ━━ */}
      {tab===4 && <div style={s.page}>
        {/* Notification Settings */}
        <div style={s.card}>
          <label style={s.lbl}>🔔 Hourly Reminders</label>
          <p style={{fontSize:"11px",color:"#5a8a5a",marginBottom:"10px",lineHeight:"1.6",background:"#0a1a0a",padding:"8px",borderRadius:"6px",border:"1px solid #1a3a1a"}}>
            App khuli ho tab hourly pop-up reminder. Android Chrome mein background notifications bhi try karta hai.
          </p>
          <div style={s.row}>
            <div style={{flex:1}}>
              <label style={s.lbl}>Wake-up Time</label>
              <input type="time" value={wakeTime} onChange={e=>{setWakeTime(e.target.value);localStorage.setItem("wake_time",e.target.value);}} style={s.inp}/>
            </div>
          </div>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginTop:"8px"}}>
            {!notifEnabled
              ? <button style={s.btn("green")} onClick={enableNotifications}>🔔 Notifications Enable Karo</button>
              : <button style={s.btn("red")} onClick={()=>setNotifEnabled(false)}>🔕 Notifications Off Karo</button>
            }
            <button style={s.btn("blue")} onClick={()=>{setShowWakeSetup(true);}}>⏰ Kal ka Wake Time Set Karo</button>
          </div>
          {notifEnabled
            ? <div style={{marginTop:"8px",fontSize:"11px",color:"#34d399"}}>✅ Notifications ON – {wakeTime} se hourly pop-ups aayenge</div>
            : <div style={{marginTop:"8px",fontSize:"11px",color:"#f87171"}}>❌ Notifications OFF</div>
          }
          <div style={{marginTop:"8px",fontSize:"10px",color:"#4a5a70",background:"#070714",padding:"8px",borderRadius:"6px",border:"1px solid #1a1a30",lineHeight:"1.6"}}>
            ⚠️ Background notifications: Android Chrome pe "Add to Home Screen" karke install karo → better chances. iOS pe kaam nahi karta.
          </div>
        </div>

        <div style={s.card}>
          <label style={s.lbl}>🔑 Gemini API Key</label>
          <p style={{fontSize:"11px",color:"#e87070",marginBottom:"8px",lineHeight:"1.6",background:"#2a0a0a",padding:"8px",borderRadius:"6px",border:"1px solid #5a1a1a"}}>
            ⚠️ Free key: <b style={{color:"#60a5fa"}}>aistudio.google.com/apikey</b>
          </p>
          <input type="password" placeholder="AIzaSy..." value={apiKeyInput} onChange={e=>setApiKeyInput(e.target.value)} style={{...s.inp,marginBottom:"10px"}}/>
          <button style={s.btn("green")} onClick={saveApiKey}>💾 Save Key</button>
          {apiKey
            ? <div style={{marginTop:"8px",fontSize:"11px",color:"#34d399"}}>✅ Key saved – AI ready</div>
            : <div style={{marginTop:"8px",fontSize:"11px",color:"#f87171"}}>❌ Key nahi – AI kaam nahi karega</div>
          }
        </div>

        <div style={s.card}>
          <label style={s.lbl}>19 Subjects Progress</label>
          {SUBJECTS.map((subj,i)=>{
            const allE=Object.values(readingData).flat().filter(e=>e.subject===subj);
            const rp=allE.reduce((a,e)=>a+e.pages,0);
            const sessions=allE.length;
            const lastRead=allE.length>0?allE.sort((a,b)=>b.date.localeCompare(a.date))[0].date:null;
            const qd=Object.values(qbankData).flat().filter(e=>e.subject===subj);
            const qt=qd.reduce((a,e)=>a+e.total,0),qw=qd.reduce((a,e)=>a+e.wrong,0);
            const acc=qt?Math.round((1-qw/qt)*100):null;
            const rc=readCounts[subj]||0;
            const rcLabel=rc===0?"":rc===1?"1st":rc===2?"2nd":rc===3?"3rd":rc+"th";
            const maxPg=Math.max(...SUBJECTS.map(s=>Object.values(readingData).flat().filter(e=>e.subject===s).reduce((a,e)=>a+e.pages,0)),1);
            return (
              <div key={subj} style={{borderBottom:"1px solid #111124",padding:"8px 0"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"3px"}}>
                  <span style={{fontSize:"12px",fontWeight:600,color:rp>0?"#c4b5fd":"#3a3a5a"}}>{i+1}. {subj}</span>
                  <div style={{display:"flex",gap:"4px",flexWrap:"wrap",justifyContent:"flex-end"}}>
                    {rp>0&&<span style={s.badge("green")}>{rp}pg</span>}
                    {rc>0&&<span style={{...s.badge("blue"),color:"#c4b5fd",background:"#1a0a2e",border:"1px solid #5b21b6"}}>{rcLabel}</span>}
                    {acc!==null?<span style={s.badge(acc>=70?"green":"red")}>{acc}%</span>:<span style={{color:"#252535",fontSize:"10px"}}>not started</span>}
                  </div>
                </div>
                {rp>0&&<div style={{height:"3px",borderRadius:"2px",background:"#1e1e35",marginBottom:"3px",overflow:"hidden"}}><div style={{height:"100%",width:Math.round(rp/maxPg*100)+"%",background:"linear-gradient(90deg,#7c3aed,#4ade80)",borderRadius:"2px"}}/></div>}
                {rp>0&&lastRead&&<div style={{fontSize:"10px",color:"#4a5a70"}}>{sessions} sessions • Last: {lastRead}</div>}
              </div>
            );
          })}
        </div>

        <div style={s.card}>
          <label style={s.lbl}>💾 Backup & Restore</label>
          <p style={{fontSize:"11px",color:"#5a8a5a",marginBottom:"10px",lineHeight:"1.6",background:"#0a1a0a",padding:"8px",borderRadius:"6px",border:"1px solid #1a3a1a"}}>
            Data sirf is browser mein hai. Weekly backup lo!
          </p>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"12px"}}>
            <button style={{...s.btn("green"),padding:"11px 18px"}} onClick={exportData}>📤 Export (.json)</button>
            <button style={{...s.btn("blue"),padding:"11px 18px"}} onClick={()=>importRef.current.click()}>📥 Import</button>
            <input type="file" ref={importRef} accept=".json" style={{display:"none"}} onChange={importData}/>
          </div>
          <label style={s.lbl}>🗑️ Delete Data</label>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap"}}>
            <button style={s.btn("red")} onClick={()=>{if(window.confirm("Daily logs delete?")){setLogs({});localStorage.removeItem("daily_logs");}}}>Daily</button>
            <button style={s.btn("red")} onClick={()=>{if(window.confirm("Reading data delete?")){setReadingData({});localStorage.removeItem("reading_data");}}}>Reading</button>
            <button style={s.btn("red")} onClick={()=>{if(window.confirm("QBank delete?")){setQbankData({});localStorage.removeItem("qbank_data");}}}>QBank</button>
          </div>
        </div>

        <div style={{...s.card,textAlign:"center"}}>
          <div style={{fontSize:"28px",marginBottom:"6px"}}>🩺</div>
          <div style={{fontSize:"13px",color:"#6a7a98"}}>MedTracker Pro v3.0</div>
          <div style={{fontSize:"10px",color:"#353545",marginTop:"4px"}}>GitHub Pages • NEET PG Edition</div>
        </div>
      </div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
